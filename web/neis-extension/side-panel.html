<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NEIS 단계 자동 입력</title>
  <link rel="stylesheet" href="side-panel.css">
</head>
<body>
  <main>
    <header class="panel-header">
      <div>
        <p class="eyebrow">NEIS INPUT ASSISTANT</p>
        <h1>단계 자동 입력</h1>
      </div>
      <span class="version" data-version></span>
    </header>

    <section class="status-card" data-status-card aria-live="polite">
      <div class="status-heading">
        <span class="status-dot" aria-hidden="true"></span>
        <strong data-status-title>입력 준비 없음</strong>
      </div>
      <p data-status-message>평가지원시스템에서 입력할 학생을 준비해 주세요.</p>
    </section>

    <section class="context-card" data-context hidden>
      <dl>
        <div><dt>학급</dt><dd data-class-label>-</dd></div>
        <div><dt>교과</dt><dd data-course>-</dd></div>
        <div><dt>평가</dt><dd data-assessment>-</dd></div>
      </dl>
    </section>

    <section class="progress-card" data-progress hidden>
      <div class="progress-copy">
        <strong data-progress-label>0 / 0명</strong>
        <span data-progress-percent>0%</span>
      </div>
      <div class="progress-track" role="progressbar" aria-label="NEIS 학생 입력 진행률" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" data-progress-track>
        <span data-progress-bar></span>
      </div>
      <div class="current-student" data-current hidden>
        <span>현재 입력</span>
        <strong data-current-student></strong>
      </div>
    </section>

    <div class="actions">
      <button class="primary" type="button" data-start disabled>자동 입력 시작</button>
      <button class="secondary" type="button" data-cancel hidden>입력 중단</button>
    </div>

    <section class="safety-note">
      <strong>저장은 자동으로 누르지 않습니다</strong>
      <p>입력이 끝나면 왼쪽 NEIS 표의 단계와 평가결과를 확인한 뒤 NEIS의 <b>저장</b>을 직접 눌러 주세요.</p>
    </section>

    <section class="student-section" data-students hidden>
      <div class="section-heading">
        <h2>입력 대상</h2>
        <span data-verified-count></span>
      </div>
      <ol class="student-list" data-student-list></ol>
    </section>
  </main>
  <script src="side-panel.js"></script>
</body>
</html>
